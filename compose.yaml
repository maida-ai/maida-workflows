services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maida_workflows
      POSTGRES_USER: maida_workflows
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maida_workflows -d maida_workflows"]
      interval: 1s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
